name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

env:
  RAYLIB_VERSION: "5.5"

jobs:

  # ============================================================
  # LINUX x86_64
  # ============================================================

  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            file \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxxf86vm-dev

      - name: Build raylib
        run: |
          git clone \
            --depth 1 \
            --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git

          cmake \
            -S raylib \
            -B raylib/build \
            -DPLATFORM=Desktop \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build raylib/build -j"$(nproc)"

          sudo cmake --install raylib/build

          sudo ldconfig

      - name: Build Chain-Lang
        run: |
          make release

      - name: Check binary
        run: |
          file chainlang

      - name: Package
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-linux-x86_64.tar.gz \
            chainlang \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-x86_64
          path: dist/chainlang-linux-x86_64.tar.gz


  # ============================================================
  # LINUX i686
  # ============================================================

  build-linux-i686:
    name: Linux i686
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable i386
        run: |
          sudo dpkg --add-architecture i386

          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            cmake \
            pkg-config \
            file \
            libgl1-mesa-dev:i386 \
            libx11-dev:i386 \
            libxrandr-dev:i386 \
            libxi-dev:i386 \
            libxcursor-dev:i386 \
            libxinerama-dev:i386 \
            libxxf86vm-dev:i386

      - name: Build raylib
        run: |
          git clone \
            --depth 1 \
            --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git

          cmake \
            -S raylib \
            -B raylib/build \
            -DPLATFORM=Desktop \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32" \
            -DCMAKE_SHARED_LINKER_FLAGS="-m32"

          cmake --build raylib/build -j"$(nproc)"

          sudo cmake --install raylib/build

          sudo ldconfig

      - name: Build Chain-Lang
        run: |
          make release \
            CXXFLAGS="-std=c++17 -Wall -Wextra -I./include -m32" \
            LDFLAGS="-lraylib -lGL -lm -lpthread -ldl -lrt -lX11 -m32"

      - name: Check binary
        run: |
          file chainlang

      - name: Package
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-linux-i686.tar.gz \
            chainlang \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-i686
          path: dist/chainlang-linux-i686.tar.gz


  # ============================================================
  # LINUX ARM64
  # ============================================================

  build-linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            file \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxxf86vm-dev

      - name: Build raylib
        run: |
          git clone \
            --depth 1 \
            --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git

          cmake \
            -S raylib \
            -B raylib/build \
            -DPLATFORM=Desktop \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build raylib/build -j"$(nproc)"

          sudo cmake --install raylib/build

          sudo ldconfig

      - name: Build Chain-Lang
        run: |
          make release

      - name: Check binary
        run: |
          file chainlang

      - name: Package
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-linux-aarch64.tar.gz \
            chainlang \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-aarch64
          path: dist/chainlang-linux-aarch64.tar.gz


  # ============================================================
  # LINUX RISC-V64
  # ============================================================

  build-linux-riscv64:
    name: Linux riscv64
    runs-on: ubuntu-latest

    # RISC-V is built through QEMU.
    # This prevents a failed experimental RISC-V build
    # from stopping the other releases.
    continue-on-error: true

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Build RISC-V64
        run: |
          docker run \
            --rm \
            --platform linux/riscv64 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            riscv64/ubuntu:24.04 \
            bash -c '
              set -e

              echo "======================================"
              echo "Installing RISC-V dependencies"
              echo "======================================"

              apt-get update

              apt-get install -y \
                build-essential \
                cmake \
                pkg-config \
                git \
                file \
                tar \
                libgl1-mesa-dev \
                libx11-dev \
                libxrandr-dev \
                libxi-dev \
                libxcursor-dev \
                libxinerama-dev \
                libxxf86vm-dev

              echo "======================================"
              echo "Downloading raylib"
              echo "======================================"

              git clone \
                --depth 1 \
                --branch 5.5 \
                https://github.com/raysan5/raylib.git

              echo "======================================"
              echo "Building raylib"
              echo "======================================"

              cmake \
                -S raylib \
                -B raylib/build \
                -DPLATFORM=Desktop \
                -DBUILD_EXAMPLES=OFF \
                -DCMAKE_BUILD_TYPE=Release

              cmake --build raylib/build -j2

              cmake --install raylib/build

              echo "======================================"
              echo "Building Chain-Lang"
              echo "======================================"

              make release

              echo "======================================"
              echo "RISC-V binary"
              echo "======================================"

              file chainlang
            '

      - name: Check binary
        run: |
          file chainlang

      - name: Package
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-linux-riscv64.tar.gz \
            chainlang \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-riscv64
          path: dist/chainlang-linux-riscv64.tar.gz


  # ============================================================
  # WINDOWS x86_64
  # ============================================================

  build-windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # MSYS2
      # --------------------------------------------------------

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

          install: >-
            git
            tar
            make
            file
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf

      # --------------------------------------------------------
      # Verify compiler
      # --------------------------------------------------------

      - name: Check compiler
        shell: msys2 {0}
        run: |
          echo "======================================"
          echo "Compiler"
          echo "======================================"

          g++ --version

          echo "======================================"
          echo "Target"
          echo "======================================"

          g++ -dumpmachine

          echo "======================================"
          echo "Make"
          echo "======================================"

          mingw32-make --version

      # --------------------------------------------------------
      # Download raylib
      # --------------------------------------------------------

      - name: Download raylib
        shell: msys2 {0}
        run: |
          git clone \
            --depth 1 \
            --branch $RAYLIB_VERSION \
            https://github.com/raysan5/raylib.git

      # --------------------------------------------------------
      # Build raylib
      # --------------------------------------------------------

      - name: Build raylib
        shell: msys2 {0}
        run: |
          cmake \
            -S raylib \
            -B raylib/build \
            -G "MSYS Makefiles" \
            -DPLATFORM=Desktop \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build raylib/build -j2

      # --------------------------------------------------------
      # Install raylib
      # --------------------------------------------------------

      - name: Install raylib
        shell: msys2 {0}
        run: |
          cmake \
            --install raylib/build \
            --prefix /mingw64

      # --------------------------------------------------------
      # Build Chain-Lang
      #
      # IMPORTANT:
      # Windows uses makefile.win.
      # Linux uses makefile.
      # --------------------------------------------------------

      - name: Build Chain-Lang
        shell: msys2 {0}
        run: |
          echo "======================================"
          echo "Building Chain-Lang for Windows"
          echo "======================================"

          mingw32-make \
            -f makefile.win \
            clean

          mingw32-make \
            -f makefile.win \
            release

      # --------------------------------------------------------
      # Check binary
      # --------------------------------------------------------

      - name: Check binary
        shell: msys2 {0}
        run: |
          echo "======================================"
          echo "Windows binary"
          echo "======================================"

          file chainlang.exe

          echo "======================================"
          echo "PE information"
          echo "======================================"

          objdump -f chainlang.exe

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-windows-x86_64.tar.gz \
            chainlang.exe \
            README.md \
            LICENSE

      # --------------------------------------------------------
      # Upload
      # --------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-windows-x86_64
          path: dist/chainlang-windows-x86_64.tar.gz


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: Publish GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build-linux-x86_64
      - build-linux-i686
      - build-linux-aarch64
      - build-linux-riscv64
      - build-windows-x86_64

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------------------------------------------
      # Download all artifacts
      # --------------------------------------------------------

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # --------------------------------------------------------
      # Collect packages
      # --------------------------------------------------------

      - name: Collect release files
        run: |
          mkdir -p release-assets

          find dist \
            -type f \
            -name "*.tar.gz" \
            -exec cp {} release-assets/ \;

          echo "======================================"
          echo "Release files"
          echo "======================================"

          ls -lh release-assets

      # --------------------------------------------------------
      # SHA256
      # --------------------------------------------------------

      - name: Generate SHA256 checksums
        run: |
          cd release-assets

          sha256sum *.tar.gz > SHA256SUMS.txt

          echo "======================================"
          echo "SHA256"
          echo "======================================"

          cat SHA256SUMS.txt

      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt

          generate_release_notes: true