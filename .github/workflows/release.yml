name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

env:
  RAYLIB_VERSION: "5.5"

jobs:

  # ============================================================
  # Linux x86_64
  # ============================================================
  build-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxxf86vm-dev

      - name: Build raylib
        run: |
          git clone \
            --depth 1 \
            --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git

          cmake \
            -S raylib \
            -B raylib/build \
            -DPLATFORM=Desktop \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build raylib/build -j"$(nproc)"

          sudo cmake --install raylib/build
          sudo ldconfig

      - name: Build Chain-Lang
        run: |
          make release

      - name: Check binary
        run: |
          file chainlang
          ./chainlang --help || true

      - name: Package
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-linux-x86_64.tar.gz \
            chainlang \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-x86_64
          path: dist/chainlang-linux-x86_64.tar.gz


  # ============================================================
  # Linux ARM64
  # ============================================================
  build-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxxf86vm-dev

      - name: Build raylib
        run: |
          git clone \
            --depth 1 \
            --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git

          cmake \
            -S raylib \
            -B raylib/build \
            -DPLATFORM=Desktop \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build raylib/build -j"$(nproc)"

          sudo cmake --install raylib/build
          sudo ldconfig

      - name: Build Chain-Lang
        run: |
          make release

      - name: Check binary
        run: |
          file chainlang

      - name: Package
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-linux-aarch64.tar.gz \
            chainlang \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-aarch64
          path: dist/chainlang-linux-aarch64.tar.gz


  # ============================================================
  # Linux i686
  # ============================================================
  build-i686:
    name: Linux i686
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable i386
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            cmake \
            pkg-config \
            libgl1-mesa-dev:i386 \
            libx11-dev:i386 \
            libxrandr-dev:i386 \
            libxi-dev:i386 \
            libxcursor-dev:i386 \
            libxinerama-dev:i386 \
            libxxf86vm-dev:i386

      - name: Build raylib
        run: |
          git clone \
            --depth 1 \
            --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git

          cmake \
            -S raylib \
            -B raylib/build \
            -DPLATFORM=Desktop \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32 \
            -DCMAKE_SHARED_LINKER_FLAGS=-m32

          cmake --build raylib/build -j"$(nproc)"

          sudo cmake --install raylib/build
          sudo ldconfig

      - name: Build Chain-Lang
        run: |
          make release \
            CXXFLAGS="-std=c++17 -Wall -Wextra -I./include -m32" \
            LDFLAGS="-lraylib -lGL -lm -lpthread -ldl -lrt -lX11 -m32"

      - name: Check binary
        run: |
          file chainlang

      - name: Package
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-linux-i686.tar.gz \
            chainlang \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-i686
          path: dist/chainlang-linux-i686.tar.gz


  # ============================================================
  # Linux RISC-V 64
  # ============================================================
  build-riscv64:
    name: Linux riscv64
    runs-on: ubuntu-latest

    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Build Chain-Lang in RISC-V container
        run: |
          docker run \
            --rm \
            --platform linux/riscv64 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            riscv64/ubuntu:24.04 \
            bash -c '
              set -e

              apt-get update

              apt-get install -y \
                build-essential \
                cmake \
                pkg-config \
                git \
                libgl1-mesa-dev \
                libx11-dev \
                libxrandr-dev \
                libxi-dev \
                libxcursor-dev \
                libxinerama-dev \
                libxxf86vm-dev

              git clone \
                --depth 1 \
                --branch '"${RAYLIB_VERSION}"' \
                https://github.com/raysan5/raylib.git

              cmake \
                -S raylib \
                -B raylib/build \
                -DPLATFORM=Desktop \
                -DBUILD_EXAMPLES=OFF \
                -DCMAKE_BUILD_TYPE=Release

              cmake --build raylib/build -j"$(nproc)"

              cmake --install raylib/build

              make release

              file chainlang
            '

      - name: Package
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-linux-riscv64.tar.gz \
            chainlang \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-riscv64
          path: dist/chainlang-linux-riscv64.tar.gz


  # ============================================================
  # Windows x86_64
  # ============================================================
  build-windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            git
            tar
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-raylib

      - name: Check tools
        shell: msys2 {0}
        run: |
          echo "Checking tools..."

          which make
          which g++
          which cmake
          which tar

          make --version
          g++ --version
          cmake --version
          tar --version

      - name: Build Chain-Lang
        shell: msys2 {0}
        run: |
          make release

      - name: Check binary
        shell: msys2 {0}
        run: |
          file chainlang.exe

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-windows-x86_64.tar.gz \
            chainlang.exe \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-windows-x86_64
          path: dist/chainlang-windows-x86_64.tar.gz


  # ============================================================
  # Windows i686
  # ============================================================
  build-windows-i686:
    name: Windows i686
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            make
            git
            tar
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-raylib

      - name: Check tools
        shell: msys2 {0}
        run: |
          echo "Checking tools..."

          which make
          which g++
          which cmake
          which tar

          make --version
          g++ --version
          cmake --version
          tar --version

      - name: Build Chain-Lang
        shell: msys2 {0}
        run: |
          make release

      - name: Check binary
        shell: msys2 {0}
        run: |
          file chainlang.exe

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist

          tar -czf \
            dist/chainlang-windows-i686.tar.gz \
            chainlang.exe \
            README.md \
            LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlang-windows-i686
          path: dist/chainlang-windows-i686.tar.gz


  # ============================================================
  # GitHub Release
  # ============================================================
  release:
    name: Publish GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build-x86_64
      - build-aarch64
      - build-i686
      - build-riscv64
      - build-windows-x86_64
      - build-windows-i686

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        run: |
          mkdir -p release-assets

          find dist \
            -type f \
            -name '*.tar.gz' \
            -exec cp {} release-assets/ \;

          echo "Release files:"
          ls -lh release-assets

      - name: Generate SHA256 checksums
        run: |
          cd release-assets

          sha256sum *.tar.gz > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
          generate_release_notes: true